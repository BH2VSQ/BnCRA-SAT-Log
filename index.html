<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卫星通联日志生成器</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <style>
        /* 防止 Vue 渲染闪烁 */
        [v-cloak] { display: none; }
        
        /* 渐变过渡 */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        
        /* Toast 过渡 */
        .toast-enter-active, .toast-leave-active { transition: all 0.3s ease; }
        .toast-enter-from, .toast-leave-to { opacity: 0; transform: translate(-50%, -20px); }
        
        /* 底部抽屉/弹窗过渡 */
        .slide-up-enter-active, .slide-up-leave-active { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide-up-enter-from, .slide-up-leave-to { transform: translateY(100%); }
        @media (min-width: 640px) {
            .slide-up-enter-from, .slide-up-leave-to { transform: scale(0.95); opacity: 0; }
            .slide-up-enter-active, .slide-up-leave-active { transition: all 0.2s ease-out; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-20 relative antialiased">
    
    <!-- Vue 挂载点 -->
    <div id="app" v-cloak class="min-h-screen p-3 sm:p-8 relative">
        
        <!-- 页面提示框 (Toast) -->
        <transition name="toast">
            <div v-if="toastMsg" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 bg-gray-900/95 backdrop-blur text-white px-5 py-3 rounded-full shadow-lg flex items-center gap-3 text-sm sm:text-base whitespace-nowrap">
                <i class="fa-solid fa-circle-info text-blue-400"></i>
                <span class="font-medium">{{ toastMsg }}</span>
            </div>
        </transition>

        <div class="max-w-3xl mx-auto space-y-4 sm:space-y-6">
            
            <!-- Header (含设置按钮) -->
            <div class="flex items-center justify-between pb-3 border-b border-gray-200">
                <div class="flex items-center gap-2.5 sm:gap-3">
                    <i class="fa-solid fa-satellite text-blue-600 text-2xl sm:text-3xl"></i>
                    <h1 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">卫星通联日志</h1>
                </div>
                <button 
                    @click="isSettingsOpen = true"
                    class="p-2 -mr-2 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors active:scale-95"
                >
                    <i class="fa-solid fa-gear text-xl"></i>
                </button>
            </div>

            <!-- 台站信息设置弹窗 (移动端底部抽屉，PC端居中弹窗) -->
            <transition name="fade">
                <div v-if="isSettingsOpen" class="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm sm:p-4" @click.self="isSettingsOpen = false">
                    <transition name="slide-up" appear>
                        <div v-if="isSettingsOpen" class="bg-white w-full sm:w-[480px] rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                            <!-- 弹窗头部 -->
                            <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                                <h2 class="text-lg font-semibold text-gray-800 flex items-center gap-2">
                                    <i class="fa-solid fa-tower-broadcast text-blue-500"></i> 台站配置
                                </h2>
                                <button @click="isSettingsOpen = false" class="text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <!-- 弹窗表单内容 -->
                            <div class="p-5 overflow-y-auto space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                        台站呼号 (STATION)
                                    </label>
                                    <input 
                                        type="text" 
                                        v-model="stationInfo.station_callsign" 
                                        @input="toUpperCase('station_callsign')"
                                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 uppercase transition-all bg-gray-50 focus:bg-white"
                                        placeholder="例如: B5CRA"
                                    />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                        操作员 (OPERATOR)
                                    </label>
                                    <input 
                                        type="text" 
                                        v-model="stationInfo.operator" 
                                        @input="toUpperCase('operator')"
                                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 uppercase transition-all bg-gray-50 focus:bg-white"
                                        placeholder="例如: BG7XWF"
                                    />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1.5">
                                        网格 (GRIDSQUARE)
                                    </label>
                                    <input 
                                        type="text" 
                                        v-model="stationInfo.my_gridsquare" 
                                        @input="toUpperCase('my_gridsquare')"
                                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 uppercase transition-all bg-gray-50 focus:bg-white"
                                        placeholder="例如: OL99WK"
                                    />
                                </div>
                                <!-- 弹窗底部按钮 -->
                                <div class="pt-4 flex gap-3 pb-safe">
                                    <button 
                                        @click="isSettingsOpen = false"
                                        class="flex-1 py-3 rounded-xl border border-gray-200 text-gray-600 font-medium hover:bg-gray-50 transition-colors"
                                    >
                                        取消
                                    </button>
                                    <button 
                                        @click="handleSaveSettings"
                                        class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700 shadow-sm transition-colors"
                                    >
                                        保存配置
                                    </button>
                                </div>
                            </div>
                        </div>
                    </transition>
                </div>
            </transition>

            <!-- 主内容区：通联输入与生成 -->
            <div class="bg-white sm:rounded-2xl shadow-sm border border-gray-100 overflow-hidden -mx-3 sm:mx-0">
                <div class="p-4 sm:p-5 space-y-6">
                    
                    <!-- 卫星选择 -->
                    <div>
                        <label class="block text-sm sm:text-base font-semibold text-gray-800 mb-3">1. 选择卫星</label>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3">
                            <button
                                v-for="(satData, satName) in SATELLITES" :key="satName"
                                @click="selectedSat = satName"
                                :class="['relative p-3 sm:p-4 rounded-xl text-center border-2 transition-all duration-200 active:scale-[0.98]', 
                                    selectedSat === satName 
                                    ? 'border-blue-500 bg-blue-50 text-blue-700 font-bold shadow-sm' 
                                    : 'border-gray-100 bg-gray-50 text-gray-600 hover:border-blue-300'
                                ]"
                            >
                                <div class="text-base sm:text-lg mb-1">{{ satName }}</div>
                                <div class="text-[10px] sm:text-xs opacity-70 font-mono tracking-tighter leading-tight">
                                    TX: {{ satData.freqTx }} <br/> RX: {{ satData.freqRx }}
                                </div>
                                <div v-if="selectedSat === satName" class="absolute top-1.5 right-1.5 sm:top-2 sm:right-2 text-blue-500">
                                    <i class="fa-solid fa-circle-check text-sm"></i>
                                </div>
                            </button>
                        </div>
                    </div>

                    <!-- 模式选择 -->
                    <div>
                        <label class="block text-sm sm:text-base font-semibold text-gray-800 mb-3">2. 通联模式</label>
                        <div class="flex flex-wrap gap-2.5">
                            <button
                                v-for="mode in availableModes" :key="mode"
                                @click="selectedMode = mode"
                                :class="['flex-1 min-w-[70px] sm:min-w-[80px] py-2.5 px-3 rounded-xl text-center border-2 font-bold transition-all active:scale-[0.98]',
                                    selectedMode === mode 
                                    ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow-sm' 
                                    : 'border-gray-100 bg-gray-50 text-gray-600 hover:border-indigo-300'
                                ]"
                            >
                                {{ mode }}
                            </button>
                        </div>
                    </div>

                    <!-- 时间设置 -->
                    <div class="bg-gray-50/80 rounded-xl p-3 sm:p-4 border border-gray-100">
                        <label class="flex items-center gap-2 text-sm sm:text-base font-semibold text-gray-800 mb-3">
                            <i class="fa-regular fa-clock text-gray-500"></i> 3. 通联时间 (UTC)
                        </label>
                        <div class="flex flex-col gap-3">
                            <!-- 模式切换 -->
                            <div class="flex bg-gray-200/60 p-1 rounded-lg w-full">
                                <button 
                                    @click="setTimeMode('auto')"
                                    :class="['flex-1 py-2 sm:py-2.5 rounded-md text-sm font-medium transition-colors', 
                                        timeMode === 'auto' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'
                                    ]"
                                >
                                    使用当前时间
                                </button>
                                <button 
                                    @click="setTimeMode('custom')"
                                    :class="['flex-1 py-2 sm:py-2.5 rounded-md text-sm font-medium transition-colors', 
                                        timeMode === 'custom' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'
                                    ]"
                                >
                                    自定义时间
                                </button>
                            </div>
                            
                            <!-- 自定义时间输入框 -->
                            <div v-if="timeMode === 'custom'" class="flex gap-2 w-full">
                                <input 
                                    type="date" 
                                    v-model="customDate"
                                    class="flex-1 px-3 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" 
                                />
                                <input 
                                    type="time" 
                                    v-model="customTime"
                                    class="flex-1 px-3 py-2.5 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" 
                                />
                            </div>
                        </div>
                    </div>

                    <!-- 呼号录入 -->
                    <div>
                        <label class="flex items-center gap-2 text-sm sm:text-base font-semibold text-gray-800 mb-3">
                            <i class="fa-solid fa-users text-gray-500"></i> 4. 对方呼号
                        </label>
                        <p class="text-xs text-gray-500 mb-2">使用空格或回车分隔多个呼号</p>
                        <textarea 
                            v-model="callsInput"
                            rows="4"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 uppercase text-lg shadow-inner bg-gray-50 outline-none resize-y"
                            placeholder="例如: JK2XXK BA7LVG"
                        ></textarea>
                    </div>

                    <!-- 生成按钮 -->
                    <button 
                        @click="generateAndDownload"
                        class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-[17px] py-3.5 sm:py-4 rounded-xl shadow-[0_4px_14px_0_rgba(37,99,235,0.39)] hover:shadow-[0_6px_20px_rgba(37,99,235,0.23)] transition-all flex items-center justify-center gap-2 active:scale-[0.98]"
                    >
                        <i class="fa-solid fa-download"></i> 自动生成并下载 ADIF
                    </button>
                </div>
            </div>

            <!-- 结果展示区 -->
            <transition name="fade">
                <div v-if="logResult" class="bg-gray-900 sm:rounded-2xl shadow-lg overflow-hidden mt-6 -mx-3 sm:mx-0">
                    <div class="px-4 py-3 flex items-center justify-between border-b border-gray-700">
                        <h2 class="text-sm font-medium text-green-400 flex items-center gap-2">
                            <i class="fa-solid fa-check-circle"></i> 日志代码生成成功
                        </h2>
                        <button 
                            @click="handleCopy"
                            class="flex items-center gap-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors border border-gray-700"
                        >
                            <i class="fa-regular fa-copy"></i> 复制全部
                        </button>
                    </div>
                    <textarea 
                        readonly
                        v-model="logResult"
                        class="w-full h-48 sm:h-64 p-4 bg-transparent text-green-400/90 font-mono text-xs sm:text-sm focus:outline-none resize-y leading-relaxed"
                    ></textarea>
                </div>
            </transition>

        </div>
    </div>

    <!-- Vue 应用逻辑 -->
    <script>
        const { createApp, ref, reactive, computed, onMounted, watch } = Vue;

        const SATELLITES = {
            'ARISS': { freqTx: '145.990', freqRx: '437.800', modes: ['FM'] },
            'AO-123': { freqTx: '145.850', freqRx: '435.400', modes: ['FM'] },
            'SO-50': { freqTx: '145.850', freqRx: '436.795', modes: ['FM'] },
            'RS-44': { freqTx: '145.000', freqRx: '435.000', modes: ['SSB', 'CW', 'FT8', 'MFSK', 'SSTV'] }
        };

        const app = createApp({
            setup() {
                // 状态
                const isSettingsOpen = ref(false); // 控制台站设置弹窗的开关
                
                const stationInfo = reactive({
                    station_callsign: '',
                    operator: '',
                    my_gridsquare: ''
                });

                const selectedSat = ref('ARISS');
                const selectedMode = ref('FM');
                
                const timeMode = ref('auto');
                const customDate = ref('');
                const customTime = ref('');
                
                const callsInput = ref('');
                const logResult = ref('');
                
                // Toast 提示状态
                const toastMsg = ref('');
                let toastTimer = null;

                const showToast = (msg) => {
                    toastMsg.value = msg;
                    if (toastTimer) clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => { toastMsg.value = ''; }, 3000);
                };

                // 计算属性
                const availableModes = computed(() => {
                    return SATELLITES[selectedSat.value].modes;
                });

                // 监听卫星切换
                watch(selectedSat, (newSat) => {
                    const modes = SATELLITES[newSat].modes;
                    if (!modes.includes(selectedMode.value)) {
                        selectedMode.value = modes[0];
                    }
                });

                // 读取本地存储
                onMounted(() => {
                    const savedConfig = localStorage.getItem('sat_station_config');
                    if (savedConfig) {
                        try {
                            const parsed = JSON.parse(savedConfig);
                            stationInfo.station_callsign = parsed.station_callsign || '';
                            stationInfo.operator = parsed.operator || '';
                            stationInfo.my_gridsquare = parsed.my_gridsquare || '';
                        } catch (e) { }
                    }

                    const savedTimePrefs = localStorage.getItem('sat_time_prefs');
                    if (savedTimePrefs) {
                        try {
                            const prefs = JSON.parse(savedTimePrefs);
                            if (prefs.timeMode) timeMode.value = prefs.timeMode;
                            if (prefs.customDate) customDate.value = prefs.customDate;
                            if (prefs.customTime) customTime.value = prefs.customTime;
                        } catch (e) { }
                    } else {
                        const now = new Date();
                        customDate.value = now.toISOString().split('T')[0];
                        customTime.value = now.toISOString().split('T')[1].substring(0, 5);
                    }
                });

                const toUpperCase = (field) => {
                    stationInfo[field] = stationInfo[field].toUpperCase();
                };

                const setTimeMode = (mode) => {
                    timeMode.value = mode;
                    saveTimePrefs();
                };

                const handleSaveSettings = () => {
                    localStorage.setItem('sat_station_config', JSON.stringify(stationInfo));
                    isSettingsOpen.value = false; // 保存后关闭弹窗
                    showToast('台站配置已保存！');
                };

                const saveTimePrefs = () => {
                    localStorage.setItem('sat_time_prefs', JSON.stringify({
                        timeMode: timeMode.value,
                        customDate: customDate.value,
                        customTime: customTime.value
                    }));
                };

                const formatAdifField = (name, value) => {
                    if (!value) return '';
                    const strVal = String(value).trim();
                    return `<${name}:${strVal.length}>${strVal}`;
                };

                // 生成并下载
                const generateAndDownload = () => {
                    const calls = callsInput.value.toUpperCase().split(/[ \n,]+/).filter(c => c.trim().length > 0);
                    if (calls.length === 0) {
                        showToast('请输入至少一个呼号！');
                        return;
                    }

                    let qsoDateStr = '';
                    let timeOnStr = '';
                    let fileTimestamp = '';

                    const nowUtc = new Date();
                    const nowUtcDate = nowUtc.toISOString().split('T')[0].replace(/-/g, '');
                    const nowUtcTime = nowUtc.toISOString().split('T')[1].replace(/:/g, '').substring(0, 6);
                    fileTimestamp = `${nowUtcDate} ${nowUtcTime}`;

                    if (timeMode.value === 'auto') {
                        qsoDateStr = nowUtcDate;
                        timeOnStr = nowUtcTime;
                    } else {
                        qsoDateStr = customDate.value ? customDate.value.replace(/-/g, '') : nowUtcDate;
                        timeOnStr = customTime.value ? (customTime.value.replace(/:/g, '') + '00') : nowUtcTime;
                    }

                    const satData = SATELLITES[selectedSat.value];

                    const headerLines = [
                        formatAdifField("CREATED_TIMESTAMP", fileTimestamp),
                        formatAdifField("PROGRAMID", "WebSatLogger"),
                        formatAdifField("PROGRAMVERSION", "1.2.0"),
                        "<EOH>"
                    ];

                    const records = calls.map(call => {
                        const fields = [
                            formatAdifField("CALL", call),
                            formatAdifField("BAND", "2M"),
                            formatAdifField("MODE", selectedMode.value),
                            formatAdifField("QSO_DATE", qsoDateStr),
                            formatAdifField("TIME_ON", timeOnStr),
                            formatAdifField("FREQ", satData.freqTx),
                            formatAdifField("BAND_RX", "70CM"),
                            formatAdifField("FREQ_RX", satData.freqRx),
                            formatAdifField("PROP_MODE", "SAT"),
                            formatAdifField("SAT_NAME", selectedSat.value),
                            formatAdifField("RST_SENT", "59"),
                            formatAdifField("RST_RCVD", "59")
                        ];

                        if (stationInfo.station_callsign) fields.push(formatAdifField("STATION_CALLSIGN", stationInfo.station_callsign));
                        if (stationInfo.operator) fields.push(formatAdifField("OPERATOR", stationInfo.operator));
                        if (stationInfo.my_gridsquare) fields.push(formatAdifField("MY_GRIDSQUARE", stationInfo.my_gridsquare));
                        
                        fields.push("<EOR>");
                        return "   " + fields.join("\n   ");
                    });

                    const finalAdif = headerLines.join("\n") + "\n\n" + records.join("\n\n") + "\n";
                    logResult.value = finalAdif;
                    saveTimePrefs();

                    // 下载逻辑
                    try {
                        const blob = new Blob([finalAdif], { type: 'text/plain' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `sat_log_${qsoDateStr}_${timeOnStr.substring(0, 4)}.adi`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                        
                        showToast('日志已生成并触发下载');
                    } catch (error) {
                        showToast('下载受限，请点击复制全部');
                    }
                };

                const handleCopy = () => {
                    const textArea = document.createElement("textarea");
                    textArea.value = logResult.value;
                    textArea.style.position = "fixed";
                    textArea.style.top = "-9999px";
                    document.body.appendChild(textArea);
                    textArea.select();
                    
                    try {
                        document.execCommand('copy');
                        showToast('日志已成功复制到剪贴板！');
                    } catch (err) {
                        showToast('复制失败，请手动全选复制');
                    }
                    
                    document.body.removeChild(textArea);
                };

                return {
                    isSettingsOpen,
                    SATELLITES,
                    stationInfo,
                    selectedSat,
                    selectedMode,
                    availableModes,
                    timeMode,
                    customDate,
                    customTime,
                    callsInput,
                    logResult,
                    toastMsg,
                    toUpperCase,
                    setTimeMode,
                    handleSaveSettings,
                    generateAndDownload,
                    handleCopy
                };
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
